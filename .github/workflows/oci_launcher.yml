name: OCI 12GB Mumbai VM Auto-Launcher

on:
  push:
    branches: [ main ]
  schedule:
    # Runs automatically 24/7
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

concurrency:
  group: oci-vm-launcher
  cancel-in-progress: false

jobs:
  launch-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run OCI Launcher
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_REGION: ap-mumbai-1
          OCI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
          MAX_RUN_MINUTES: 330
          RETRY_INTERVAL: 60
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python oci_vm_launcher.py

      - name: Upload VM Credentials (If Created)
        if: always()
        run: |
          if [ -f instance_created.txt ]; then
            echo "INSTANCE_CREATED=true" >> $GITHUB_ENV
          fi

      - name: Save VM Access Key and Details
        if: env.INSTANCE_CREATED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: oci-vm-credentials
          path: |
            instance_created.txt
            oci_vm_key
          retention-days: 14
